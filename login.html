<script>
  function toggleTheme() {
    const t = document.documentElement.getAttribute('data-theme');
    const nt = t === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', nt);
    document.getElementById('theme-btn').textContent = nt === 'dark' ? '🌙' : '☀️';
    localStorage.setItem('ghaith_theme', nt);
  }
  (function () { 
    const t = localStorage.getItem('ghaith_theme') || 'dark'; 
    document.documentElement.setAttribute('data-theme', t); 
    setTimeout(() => { 
      const b = document.getElementById('theme-btn'); 
      if (b) b.textContent = t === 'dark' ? '🌙' : '☀️'; 
    }, 100); 
  })();
</script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="assets/js/firebase-config.js"></script>

<script>
 
  const urlParams = new URLSearchParams(window.location.search);
  if(urlParams.get('logout') === 'true') {
      firebase.auth().signOut();
  }

  // التحقق لو الطالب مسجل دخول أصلاً يوديه للداش بورد أوتوماتيك
  firebase.auth().onAuthStateChanged((user) => {
    if (user && urlParams.get('logout') !== 'true') {
      window.location.href = 'dashboard.html';
    }
  });

  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const rawEmailOrCode = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errorMsgDiv = document.getElementById('error-message');
    const loginBtn = document.getElementById('login-btn');

    // خدعة الأكواد: لو المدخل مفيش فيه @ بنعتبره كود ونضيفله دومين المنصة الوهمي
    let email = rawEmailOrCode;
    if (!email.includes('@')) {
      email = email + '@ghaith.com';
    }

    loginBtn.innerText = 'جاري تسجيل الدخول...';
    loginBtn.disabled = true;
    errorMsgDiv.style.display = 'none';

    // عملية تسجيل الدخول بفايربيس
    firebase.auth().signInWithEmailAndPassword(email, password)
      .then((userCredential) => {
        window.location.href = 'dashboard.html';
      })
      .catch((error) => {
        loginBtn.innerText = 'تسجيل الدخول';
        loginBtn.disabled = false;

        const errorCode = error.code;
        const errorMessage = error.message;
        
        let friendlyMessage = 'حدث خطأ غير متوقع، يرجى المحاولة مرة أخرى.';
        
        // ترجمة رسائل فايربيس للعربي وتغطية التحديث الأمني الأخير
        if (errorCode === 'auth/invalid-credential' || errorMessage.includes('INVALID_LOGIN_CREDENTIALS')) {
          friendlyMessage = 'بيانات الدخول غير صحيحة، يرجى التأكد من البريد وكلمة السر.';
        } else if (errorCode === 'auth/user-not-found') {
          friendlyMessage = 'هذا الحساب غير مسجل لدينا، تأكد من بريدك أو كودك.';
        } else if (errorCode === 'auth/wrong-password') {
          friendlyMessage = 'كلمة السر غير صحيحة.';
        } else if (errorCode === 'auth/invalid-email') {
          friendlyMessage = 'صيغة البريد الإلكتروني غير صحيحة.';
        } else if (errorCode === 'auth/too-many-requests') {
          friendlyMessage = 'محاولات كثيرة خاطئة، يرجى المحاولة لاحقاً.';
        }

        errorMsgDiv.innerText = friendlyMessage;
        errorMsgDiv.style.display = 'block';
      });
  });
</script>
