<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حل الواجب - منصة غيث للفيزياء</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Josefin+Sans:wght@400;700;900&family=Montserrat:wght@400;700;900&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    :root {
      --physics-teal: #1a4f5c;
      --society-green: #bacb3f;
    }

    .tech-background {
      background-color: #fdfdfd;
      background-image: radial-gradient(var(--physics-teal) 1px, transparent 1px), radial-gradient(var(--physics-teal) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      opacity: 0.9;
    }

    .assignment-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .assignment-card {
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      border: 1px solid rgba(26, 79, 92, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    .assignment-header {
      border-bottom: 2px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 20px;
    }

    .assignment-title {
      font-size: 1.8rem;
      color: var(--physics-teal);
      font-weight: 900;
      margin-bottom: 10px;
    }

    .assignment-desc {
      color: #718096;
      line-height: 1.8;
      font-size: 1rem;
    }

    .pdf-box {
      background: rgba(239, 68, 68, 0.05);
      border: 1px dashed #ef4444;
      padding: 15px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 20px 0;
    }

    .solution-form {
      margin-top: 30px;
    }

    .solution-form label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
      color: var(--physics-teal);
    }

    .solution-textarea {
      width: 100%;
      min-height: 200px;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;
      resize: vertical;
      margin-bottom: 20px;
    }

    .solution-input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg3);
      margin-bottom: 20px;
    }

    .submit-btn {
      background: var(--society-green);
      color: var(--physics-teal);
      border: none;
      padding: 12px 40px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
    }

    .submit-btn:hover {
      background: #aab832;
      transform: translateY(-2px);
    }

    .submit-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body class="tech-background">

<div class="dash-layout">
  <aside class="dash-sidebar" id="sidebar">
    <a href="index.html" class="dash-logo">غ<span>ي</span>ث</a>
    <nav class="dash-nav">
      <a href="dashboard.html" class="dash-nav-item">
        <span class="dash-nav-icon"></span> الرئيسية
      </a>
      <a href="courses.html" class="dash-nav-item active">
        <span class="dash-nav-icon"></span> كورساتي
      </a>
      <a href="assignments.html" class="dash-nav-item">
        <span class="dash-nav-icon"></span> الواجبات
      </a>
      <a href="evaluations.html" class="dash-nav-item">
        <span class="dash-nav-icon"></span> تقييمي
      </a>
    </nav>
  </aside>

  <main class="dash-main">
    <header class="dash-topbar">
      <button class="dash-menu-btn" onclick="toggleSidebar()">☰</button>
      <div style="flex:1"></div>
      <div class="dash-topbar-right">
        <div class="dash-user-profile">
          <div class="dash-user-info" style="text-align: left;">
            <h4 id="user-name-display">طالب غيث</h4>
          </div>
          <div class="dash-user-avatar" id="user-avatar-display">أ</div>
        </div>
      </div>
    </header>

    <div class="assignment-container">
      <div id="loading-msg" style="text-align: center; color: var(--physics-teal); font-weight: bold;">جاري تحميل بيانات الواجب...</div>

      <div id="assignment-content" class="assignment-card" style="display: none;">
        <div class="assignment-header">
          <h1 class="assignment-title" id="assign-title">عنوان الواجب</h1>
          <p class="assignment-desc" id="assign-desc">وصف الواجب يظهر هنا...</p>
        </div>

        <div id="pdf-container" class="pdf-box" style="display: none;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <i class="fa-solid fa-file-pdf" style="font-size: 1.5rem; color: #ef4444;"></i>
            <span style="font-weight: bold; color: var(--physics-teal);">ملف أسئلة الواجب المرفق</span>
          </div>
          <a href="#" id="assign-pdf-link" target="_blank" style="color: #ef4444; font-weight: bold; text-decoration: none; border: 1px solid #ef4444; padding: 5px 15px; border-radius: 5px;">تحميل PDF</a>
        </div>

        <div id="msg-box" style="display: none; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: bold;"></div>

        <form id="submission-form" class="solution-form">
          <label>اكتب خطوات الحل أو إجابتك هنا:</label>
          <textarea id="answer-text" class="solution-textarea" placeholder="اكتب إجابتك بالتفصيل..." required></textarea>

          <label>رابط خارجي (اختياري) - مثل رابط صورة للحل أو ملف على جوجل درايف:</label>
          <input type="url" id="answer-link" class="solution-input" placeholder="https://example.com/your-image.jpg">

          <button type="submit" id="submit-btn" class="submit-btn">تسليم الواجب الآن</button>
        </form>
      </div>
    </div>

    <footer class="footer" style="background: var(--physics-teal); color: #fff; padding: 30px; text-align: center; margin-top: 50px;">
       <p style="font-family: 'Cairo';">MHD Powered by  جميع الحقوق محفوظة @2026</p>
    </footer>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="assets/js/firebase-config.js"></script>

<script>
  let currentUserId = null;
  let currentUserName = "";
  let assignmentId = new URLSearchParams(window.location.search).get('id');

  firebase.auth().onAuthStateChanged((user) => {
    if (user) {
      currentUserId = user.uid;

      firebase.database().ref('users/' + user.uid).once('value').then(snap => {
        if(snap.exists()){
          currentUserName = snap.val().name;
          document.getElementById('user-name-display').innerText = currentUserName;
          document.getElementById('user-avatar-display').innerText = currentUserName.charAt(0);
        }
      });
      loadAssignmentDetails();
    } else {
      window.location.href = 'login.html';
    }
  });

  function loadAssignmentDetails() {
    if (!assignmentId) {
      alert("خطأ: لم يتم تحديد الواجب!");
      window.location.href = 'dashboard.html';
      return;
    }

    firebase.database().ref('assignments/' + assignmentId).once('value').then((snapshot) => {
      if (snapshot.exists()) {
        const data = snapshot.val();
        document.getElementById('assign-title').innerText = data.title;
        document.getElementById('assign-desc').innerText = data.description || "لا يوجد وصف إضافي.";

        if (data.pdfUrl) {
          document.getElementById('pdf-container').style.display = 'flex';
          document.getElementById('assign-pdf-link').href = data.pdfUrl;
        }

        document.getElementById('loading-msg').style.display = 'none';
        document.getElementById('assignment-content').style.display = 'block';
      } else {
        alert("عذراً، هذا الواجب غير موجود.");
        window.location.href = 'dashboard.html';
      }
    });
  }

  document.getElementById('submission-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const submitBtn = document.getElementById('submit-btn');
    const msgBox = document.getElementById('msg-box');

    const answerText = document.getElementById('answer-text').value;
    const answerLink = document.getElementById('answer-link').value;

    submitBtn.disabled = true;
    submitBtn.innerText = "جاري التسليم...";

    firebase.database().ref('assignment_submissions/' + assignmentId + '/' + currentUserId).set({
      studentId: currentUserId,
      studentName: currentUserName,
      answerText: answerText,
      answerLink: answerLink,
      status: "submitted",
      submittedAt: firebase.database.ServerValue.TIMESTAMP,
      date: new Date().toLocaleDateString('ar-EG')
    }).then(() => {
      msgBox.innerText = "تم تسليم الواجب بنجاح! سيقوم المستر بتقييمه قريباً.";
      msgBox.style.display = "block";
      msgBox.style.background = "#10b98120";
      msgBox.style.color = "#10b981";
      msgBox.style.border = "1px solid #10b981";

      submitBtn.innerText = "تم التسليم";
      // بعد 3 ثواني نرجعه لصفحة الكورس
      setTimeout(() => {
        window.history.back();
      }, 3000);
    }).catch(error => {
      console.error(error);
      submitBtn.disabled = false;
      submitBtn.innerText = "إعادة المحاولة";
    });
  });

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
  }
</script>
</body>
</html>
