            <option>القلوبية</option>

            <option>الشرقية</option>
            <option>المنصورة</option>
            <option>أسوان</option>
            <option>أسيوط</option>
            <option>الأقصر</option>
            <option>البحر الأحمر</option>
            <option>البحيرة</option>
            <option>بورسعيد</option>
            <option>بني سويف</option>
            <option>الإسماعيلية</option>
            <option>كفر الشيخ</option>
            <option>مطروح</option>
            <option>الوادي الجديد</option>
            <option>دمياط</option>
            <option>سوهاج</option>
            <option>جنوب سيناء</option>
            <option>شمال سيناء</option>
          </select>
        </div>
        
        <div class="auth-input-group">
          <label>النوع</label>
          <select id="reg-gender" required>
            <option value="" disabled selected>اختر النوع</option>
            <option>ذكر</option>
            <option>أنثى</option>
          </select>
        </div>
        
        <div class="auth-input-group">
          <label>الصف الدراسي</label>
          <select id="reg-grade" required>
            <option value="" disabled selected>اختر الصف</option>
            <option>الصف الأول الثانوي</option>
            <option>الصف الثاني الثانوي</option>
            <option>الصف الثالث الثانوي</option>
          </select>
        </div>
        
        <div class="auth-input-group">
          <label>الشعبة</label>
          <select id="reg-track" required>
            <option value="" disabled selected>اختر الشعبة</option>
            <option>علمي علوم</option>
            <option>علمي رياضة</option>
            <option>أدبي</option>
            <option>عام (للصف الأول/الثاني)</option>
          </select>
        </div>
        
        <div class="auth-input-group">
          <label>البريد الإلكتروني 📧</label>
          <input type="email" id="reg-email" required>
        </div>
        
        <div class="auth-row">
          <div class="auth-input-group">
            <label>كلمة السر 🔒</label>
            <input type="password" id="reg-password" required minlength="6">
          </div>
          <div class="auth-input-group">
            <label>تأكيد كلمة السر 🔒</label>
            <input type="password" id="reg-confirm" required minlength="6">
          </div>
        </div>
        
        <button type="submit" id="reg-submit-btn" class="auth-submit">انشاء حساب</button>
      </form>

<script>
  function toggleTheme() {
    const t = document.documentElement.getAttribute('data-theme');
    const nt = t === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', nt);
    document.getElementById('theme-btn').textContent = nt === 'dark' ? '🌙' : '☀️';
    localStorage.setItem('ghaith_theme', nt);
  }
  (function () { 
    const t = localStorage.getItem('ghaith_theme') || 'dark'; 
    document.documentElement.setAttribute('data-theme', t); 
    setTimeout(() => { 
      const b = document.getElementById('theme-btn'); 
      if (b) b.textContent = t === 'dark' ? '🌙' : '☀️'; 
    }, 100); 
  })();
</script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="assets/js/firebase-config.js"></script>

<!-- Firebase Registration Logic -->
<script>
  document.getElementById('register-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    // سحب البيانات من الخانات
    const fname = document.getElementById('reg-fname').value.trim();
    const sname = document.getElementById('reg-sname').value.trim();
    const tname = document.getElementById('reg-tname').value.trim();
    const lname = document.getElementById('reg-lname').value.trim();
    const phone = document.getElementById('reg-phone').value.trim();
    const fphone = document.getElementById('reg-fphone').value.trim();
    const mphone = document.getElementById('reg-mphone').value.trim();
    const gov = document.getElementById('reg-gov').value;
    const gender = document.getElementById('reg-gender').value;
    const grade = document.getElementById('reg-grade').value;
    const track = document.getElementById('reg-track').value;
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const confirmPassword = document.getElementById('reg-confirm').value;

    const msgDiv = document.getElementById('reg-msg');
    const submitBtn = document.getElementById('reg-submit-btn');

    // 1. التأكد من تطابق كلمة السر
    if (password !== confirmPassword) {
      showMessage('كلمتا السر غير متطابقتين!', 'error');
      return;
    }

    
    submitBtn.disabled = true;
    submitBtn.innerText = 'جاري إنشاء الحساب...';
    msgDiv.style.display = 'none';

    // 3. إنشاء الحساب في فايربيس
    firebase.auth().createUserWithEmailAndPassword(email, password)
      .then((userCredential) => {
        const user = userCredential.user;
        const fullName = `${fname} ${sname} ${tname} ${lname}`;

        // 4. حفظ باقي البيانات في قاعدة البيانات
        return firebase.database().ref('users/' + user.uid).set({
          name: fullName,
          phone: phone,
          fatherPhone: fphone,
          motherPhone: mphone,
          governorate: gov,
          gender: gender,
          grade: grade,
          track: track,
          email: email,
          role: 'student', 
          createdAt: firebase.database.ServerValue.TIMESTAMP
        });
      })
      .then(() => {
        
        firebase.auth().signOut().then(() => {
          showMessage('تم التسجيل بنجاح! سيتم تحويلك لصفحة تسجيل الدخول...', 'success');
          
          setTimeout(() => {
            window.location.href = 'login.html'; 
          }, 3000); 
        });
      })
      .catch((error) => {
        submitBtn.disabled = false;
        submitBtn.innerText = 'انشاء حساب';

        let errorMessage = 'حدث خطأ، يرجى المحاولة مرة أخرى.';
        if (error.code === 'auth/email-already-in-use') {
          errorMessage = 'البريد الإلكتروني مستخدم بالفعل في حساب آخر.';
        } else if (error.code === 'auth/weak-password') {
          errorMessage = 'كلمة السر ضعيفة جداً، يجب أن تكون 6 أحرف على الأقل.';
        }
        
        showMessage(errorMessage, 'error');
      });
  });

  // دالة مساعدة لعرض الرسائل
  function showMessage(text, type) {
    const msgDiv = document.getElementById('reg-msg');
    msgDiv.innerText = text;
    msgDiv.style.display = 'block';
    if (type === 'error') {
      msgDiv.style.background = '#ef444420';
      msgDiv.style.color = 'var(--red)';
      msgDiv.style.border = '1px solid var(--red)';
    } else {
      msgDiv.style.background = '#10b98120';
      msgDiv.style.color = 'var(--green)';
      msgDiv.style.border = '1px solid var(--green)';
    }
  }
</script>
